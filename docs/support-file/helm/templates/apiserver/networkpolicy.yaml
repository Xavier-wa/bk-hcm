{{- if .Values.apiserver.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "bk-hcm.fullname" . }}-apiserver-mcp-internal
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      component: apiserver
  policyTypes:
    - Ingress
  ingress:
    {{- include "common.tplvalues.render" (dict "value" .Values.apiserver.networkPolicy.ingress "context" $) | nindent 4 }}
{{- end }}
