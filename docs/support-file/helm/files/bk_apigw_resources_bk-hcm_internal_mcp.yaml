                              type: number
                              description: 业务ID
                            core_type:
                              type: string
                              description: 核心类型
                            disk_type:
                              type: string
                              description: 云盘类型
                            plan_type:
                              type: string
                              description: 计划类型
                            region_id:
                              type: string
                              description: 地区/城市ID
