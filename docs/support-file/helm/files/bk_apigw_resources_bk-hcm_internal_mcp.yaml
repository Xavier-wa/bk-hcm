                        description: 申请的CBS信息
                      cvm:
                        type: object
                        properties:
                          os:
                            type: integer
                            example: 123
                            description: OS数，单位：台
                          memory:
                            type: integer
                            example: 123
                            description: 内存大小，单位：GB
                          cpu_core:
                            type: integer
                            example: 123
                            description: CPU核心数，单位：核
                          res_mode:
                            enum:
                            - 按机型
                            - 按机型族
                            type: string
                            example: 按机型
                            description: 资源模式
                          device_type:
                            type: string
                            example: S5.2XLARGE16
                            description: 机型规格
                        description: 申请的CVM信息
                      remark:
                        type: string
                        example: 这里是需求备注
                        description: 需求备注
                      zone_id:
                        type: string
                        example: ap-shanghai-2
                        description: 可用区ID
                      region_id:
                        type: string
                        example: ap-shanghai
                        description: 地区/城市ID
                      expect_time:
                        type: string
                        example: '2024-11-12'
                        description: 期望交付时间，格式为YYYY-MM-DD
                      obs_project:
                        type: string
                        example: 常规项目
                        description: OBS项目类型
                      demand_source:
                        type: string
                        example: 指标变化
                        description: 需求分类/变更原因
                      demand_res_types:
                        type: array
