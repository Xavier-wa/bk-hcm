    post:
      operationId: get_biz_apply_recommend_by_static
      description: 离线偏好叠加库存在线推荐。基于离线静态偏好推荐记录叠加库存校验，为业务返回在线推荐方案列表；优先使用用户维度的静态推荐记录，不足时以业务维度推荐记录按四元组(需求类型/地域/机型/镜像)去重补足，仅保留库存充足(capacity≥申请数量)的候选项。
      tags:
      - SCR
      - Apply
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    description: 错误编码。0 表示 success，>0 表示失败错误
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            source:
                              type: string
                              description: 推荐来源：`user`-用户维度 / `biz`-业务维度
                            suborder:
                              type: object
                              properties:
                                zone:
                                  type: string
                                  description: 可用区；未传 `zone` 入参时值为 `"all"`（表示不限可用区）
                                region:
                                  type: string
                                  description: 地域
                                image_id:
                                  type: string
                                  description: 镜像ID
                                replicas:
                                  type: number
                                  description: 申请数量
                                data_disk:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      disk_num:
                                        type: number
                                        description: 磁盘数量
                                      disk_size:
                                        type: number
                                        description: 磁盘大小，单位 GB
                                      disk_type:
                                        type: string
                                        description: 磁盘类型：`CLOUD_PREMIUM`-高性能云硬盘 / `CLOUD_SSD`-SSD云硬盘
                                  description: 数据盘规格列表
                                res_assign:
                                  type: number
                                  description: 资源分配方式：1-有资源区域优先 / 2-分Campus生产；指定具体 `zone` 时不返回该字段
                                bk_asset_id:
                                  type: string
                                  description: 继承固资号；仅滚服候选返回
                                charge_type:
                                  type: string
                                  description: 计费模式：`PREPAID`-包年包月 / `POSTPAID_BY_HOUR`-按量计费；非滚服候选固定为 `PREPAID`，滚服候选取自命中固资的计费模式
                                device_type:
                                  type: string
                                  description: 机型
                                system_disk:
                                  type: object
                                  properties:
                                    disk_num:
                                      type: number
                                      description: 磁盘数量
                                    disk_size:
                                      type: number
                                      description: 磁盘大小，单位 GB
                                    disk_type:
                                      type: string
                                      description: 磁盘类型：`CLOUD_PREMIUM`-高性能云硬盘 / `CLOUD_SSD`-SSD云硬盘
                                  description: 系统盘规格
                                require_type:
                                  type: number
                                  description: 需求类型：1-常规项目 / 2-春节保障 / 3-机房裁撤 / 6-滚服项目 / 7-小额绿通 / 8-春保资源池 / 9-短租项目
                                charge_months:
                                  type: number
                                  description: 购买时长，单位月，取命中固资的剩余月数；仅滚服候选返回，按量计费固资算不出正值时不返回该字段
                                billing_start_time:
                                  type: string
                                  description: 继承固资的套餐计费起始时间，RFC3339 格式；仅滚服候选返回，固资无该时间时不返回该字段
                                billing_expire_time:
                                  type: string
                                  description: 继承固资的套餐计费到期时间，RFC3339 格式；仅滚服候选返回，按量计费固资无到期时间时不返回该字段
                                inherit_instance_id:
