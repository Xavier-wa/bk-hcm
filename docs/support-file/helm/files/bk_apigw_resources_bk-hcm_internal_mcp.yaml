                              type: number
                              description: 已申请OS数
                            demand_ids:
                              type: array
                              items:
                                type: object
                                properties:
                                  '':
                                    type: string
                              description: 预测需求ID列表。单条预测时包含一个ID；聚合预测时包含被聚合的所有原始需求ID
                            bk_biz_name:
                              type: string
                              description: 业务名称
                            device_type:
                              type: string
                              description: 机型规格
                            expect_time:
                              type: string
                              description: 期望交付日期，格式YYYY-MM-DD
                            is_original:
                              type: boolean
                              description: 是否为原始机型。true=预测需求本身的机型；false=可通配的其他机型
                            obs_project:
                              type: string
                              description: 项目类型
                            region_name:
                              type: string
                              description: 地区/城市名称
                            remained_os:
