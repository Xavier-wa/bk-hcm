                      description: 是否返回总记录条数。如果为true，返回展开后的总条数 count，不返回详情，此时 start 和 limit 须设置为0；如果为false，则根据 start 和 limit 返回明细数据，不返回 count
                    limit:
                      type: number
                      default: ''
                      description: 每页限制条数，最大500，不能为0
                    start:
                      type: number
                      default: ''
                      description: 记录开始位置，start 起始值为0
                  description: 分页设置，分页作用于展开后的明细记录
                memories:
                  type: array
                  items:
                    type: number
                    default: ''
                  default: ''
                  description: 内存大小筛选列表（单位GB），用于过滤可申领机型，不传时不过滤
                statuses:
                  type: array
                  items:
                    type: string
                    default: ''
                  default: ''
                  description: 状态，枚举值：can_apply（可申领）、not_ready（未到申领时间）、expired（已过期）、spent_all（已耗尽）、locked（变更中），不传时查询全部
                cpu_cores:
                  type: array
                  items:
                    type: number
                    default: ''
                  default: ''
                  description: CPU核心数筛选列表，用于过滤可申领机型，不传时不过滤
                core_types:
                  type: array
                  items:
                    type: string
                    default: ''
                  default: ''
                  description: 核心类型列表，不传时查询全部，枚举值：大核心、小核心
                plan_types:
                  type: array
                  items:
                    type: string
                    default: ''
                  default: ''
                  description: 计划类型列表，不传时查询全部，枚举值：预测内、预测外
                region_ids:
                  type: array
                  items:
                    type: string
                    default: ''
                  default: ''
                  description: 地区/城市ID列表，不传时查询全部，例如：ap-nanjing、ap-guangzhou
                device_types:
                  type: array
                  items:
                    type: string
                    default: ''
                  default: ''
                  description: 原始机型规格列表，不传时查询全部，例如：SA9.LARGE8、ITA5.4XLARGE64
                obs_projects:
                  type: array
                  items:
                    type: string
                    default: ''
                  default: ''
                  description: OBS项目类型列表，不传时查询全部，数量最大100
                expiring_only:
                  type: boolean
                  default: ''
                  description: 是否只查询即将过期的需求，传true时只返回即将过期的需求，传false时查询全部，默认查询全部
                device_classes:
                  type: array
                  items:
                    type: string
                    default: ''
                  default: ''
                  description: 机型分类列表，不传时查询全部，例如：标准型SA9、标准型SA5
                device_families:
                  type: array
                  items:
                    type: string
                    default: ''
                  default: ''
                  description: 机型族列表，不传时查询全部，例如：标准型、高IO型
                expect_time_range:
                  type: object
                  default: ''
                  required:
                  - end
                  - start
                  properties:
                    end:
                      type: string
                      default: ''
                      description: 结束时间，不能早于start时间，格式为YYYY-MM-DD，例如2024-01-01
                    start:
                      type: string
                      default: ''
                      description: 起始时间，格式为YYYY-MM-DD，例如2024-01-01
                  description: 期望交付时间范围
        required: false
        description: ''
