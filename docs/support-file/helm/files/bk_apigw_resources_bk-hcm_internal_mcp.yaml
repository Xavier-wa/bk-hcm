                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: VPC的HCM ID
                            memo:
                              type: string
                            name:
                              type: string
                            region:
                              type: string
                            vendor:
                              type: string
                              description: 云厂商
                            creator:
                              type: string
                            reviser:
                              type: string
                            category:
                              type: string
                            cloud_id:
                              type: string
                              description: VPC的云上 ID
                            bk_biz_id:
                              type: number
                              description: 业务ID，-1表示没有分配到业务
                            account_id:
                              type: string
                              description: 云账号的HCM ID
                            created_at:
                              type: string
                              description: 创建时间，标准格式：2006-01-02T15:04:05Z
                            updated_at:
                              type: string
                  message:
                    type: string
          description: ''
      parameters:
      - in: path
        name: bk_biz_id
        schema:
          type: number
        required: true
        description: 业务ID
      - in: path
        name: vendor
        schema:
          type: string
        required: true
        description: 云厂商类型
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              - filter
              properties:
                page:
                  type: object
                  default: ''
                  required:
                  - count
                  properties:
                    sort:
                      type: string
                      default: ''
                      description: 排序字段，返回数据将按该字段进行排序
                    count:
                      type: boolean
                      default: ''
                      description: 是否返回总记录条数。如果为true，查询结果返回总记录条数count，但查询结果详情数据details为空数组，此时start和limit参数将无效，且必需设置为0。如果为false，则根据start和limit参数，返回查询结果详情数据，但总记录条数count为0
                    limit:
                      type: number
                      default: ''
                      description: 每页限制条数，最大500，不能为0
                    order:
                      type: string
                      default: ''
                      description: 排序顺序
                    start:
                      type: number
                      default: ''
                      description: 记录开始位置，start起始值为0
                  description: 分页设置
                filter:
                  type: object
                  default: ''
                  required:
                  - op
                  - rules
                  properties:
                    op:
                      type: string
                      default: ''
                      description: 操作符。如果是and，则表示多个rule之间是且的关系；如果是or，则表示多个rule之间是或的关系
                    rules:
                      type: array
                      items:
                        type: object
                        default: ''
                        required:
                        - op
                        - field
                        - value
                        properties:
                          op:
                            type: string
                            default: ''
                            description: 操作符（枚举值：eq（等于，不能为空字符串）、neq（不等于，不能为空字符串）、gt、gte、le、lte、in（在给定的数组范围中）、nin（不在给定的数组范围中）、cs（模糊查询，区分大小写）、cis（模糊查询，不区分大小写））
                          field:
                            type: string
                            default: ''
                            description: 查询条件Field名称。可选条件：id(VPC的HCM ID)、vendor(云厂商（枚举值：tcloud、aws、azure、gcp、huawei）)、account_id(云账号的HCM ID)、cloud_id(VPC的云ID)、name(VPC名称)、region(地域)、category(VPC类别（枚举值：biz（业务自用）、backbone（接入骨干网））)、memo(备注)、bk_biz_id(业务ID，-1表示没有分配到业务)、creator(创建者)、reviser(更新者)、created_at(创建时间，标准格式：2006-01-02T15:04:05Z)、updated_at(更新时间，标准格式：2006-01-02T15:04:05Z)
                          value:
                            type: string
                            default: ''
                            description: 查询条件Value值，类型根据field和op的不同而不同
                      default: ''
                      description: 过滤规则，最多设置5个rules。如果rules为空数组，op（操作符）将没有作用，代表查询全部数据
        required: true
        description: ''
