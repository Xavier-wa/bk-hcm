                              type: number
                              description: 预测总CPU核数
                            demand_res_type:
                              type: string
                              description: 预测资源类型，枚举值：CVM
                            technical_class:
                              type: string
                              description: 机型技术分类
                            applied_cpu_core:
                              type: number
                              description: 已申请CPU核数
                            return_plan_time:
                              type: string
                              description: 预期退回时间，格式YYYY-MM-DD，仅短租项目存在，其他为null
                            device_type_class:
                              type: string
                              description: 通/专用机型类型，枚举值：CommonType（通用）、SpecialType（专用）
                            remained_cpu_core:
                              type: number
                              description: 剩余CPU核数
