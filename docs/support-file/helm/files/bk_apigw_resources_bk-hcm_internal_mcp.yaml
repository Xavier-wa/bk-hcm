                  type: string
                  description: 负载均衡ID
                filter:
                  type: object
                  example:
                    op: and
                    rules:
                    - op: eq
                      field: name
                      value: test
                    - op: in
                      field: id
                      value:
                      - sg-001
                      - sg-002
                  required:
                  - op
                  - rules
                  properties:
                    op:
                      enum:
                      - and
                      - or
                      type: string
                      example: and
                      description: 操作符。如果是and，则表示多个rule之间是且的关系；如果是or，则表示多个rule之间是或的关系
                    rules:
                      type: array
                      items:
                        type: object
                        required:
                        - field
                        - op
                        - value
                        properties:
                          op:
                            enum:
                            - eq
                            - neq
                            - gt
                            - gte
                            - lt
                            - lte
                            - in
                            - nin
                            - cs
                            - cis
                            type: string
                            example: eq
                            description: 操作符
                          field:
                            type: string
                            example: name
                            description: 查询条件Field名称
                          value:
                            oneOf:
                            - type: string
                            - type: number
                            - type: boolean
                            - type: array
                              items:
                                oneOf:
                                - type: string
                                - type: number
                                - type: boolean
                            example: test
                            description: 查询条件Value值，类型根据field和op的不同而不同
                      maxItems: 5
                      description: 过滤规则，最多设置5个rules。如果rules为空数组，op（操作符）将没有作用，代表查询全部数据
