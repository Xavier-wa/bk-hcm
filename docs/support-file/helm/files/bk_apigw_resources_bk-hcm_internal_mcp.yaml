                  data:
                    type: object
                    properties:
                      count:
                        type: number
                        description: 当前规则能匹配到的总记录条数，仅当请求参数 page.count 为 true 时才返回
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 安全组的HCM ID
                            memo:
                              type: string
                            name:
                              type: string
                            region:
                              type: string
                            vendor:
                              type: string
                              description: 云厂商
                            creator:
                              type: string
                            manager:
                              type: string
                              description: 负责人
                            reviser:
                              type: string
                            cloud_id:
                              type: string
                              description: 安全组的云上 ID
                            bk_biz_id:
                              type: number
                              description: 业务ID，-1表示没有分配到业务
                            mgmt_type:
                              type: string
                              description: 管理类型，枚举值：biz（业务管理）、platform（平台管理）。该字段可能为空，表示未确定管理类型
                            account_id:
                              type: string
                              description: 云账号的HCM ID
                            created_at:
                              type: string
                            updated_at:
                              type: string
                            bak_manager:
                              type: string
                            mgmt_biz_id:
                              type: number
                              description: 管理业务ID
                            usage_biz_ids:
                              type: array
                              items:
                                type: object
                                properties:
                                  usage_biz_id:
                                    type: number
                              description: 使用业务ID列表，-1代表全部业务可使用
                            cloud_update_time:
                              type: string
                            cloud_created_time:
                              type: string
                    description: 响应数据
                  message:
                    type: string
                    description: 请求信息
                description: 成功
          description: 成功
      parameters:
      - in: path
        name: bk_biz_id
        schema:
          type: number
        required: true
        description: 业务ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              - filter
              properties:
                page:
                  type: object
                  default: ''
                  required:
                  - count
                  properties:
                    sort:
                      type: string
                      default: ''
                      description: 排序字段，返回数据将按该字段进行排序
                    count:
                      type: boolean
                      default: ''
                      description: 是否返回总记录条数。如果为true，查询结果返回总记录条数count，但查询结果详情数据details为空数组，此时start和limit参数将无效，且必需设置为0。如果为false，则根据start和limit参数，返回查询结果详情数据，但总记录条数count为0
                    limit:
                      type: number
                      default: ''
                      description: 每页限制条数，最大500，不能为0
                    order:
                      type: string
                      default: ''
                      description: 排序顺序
                    start:
                      type: number
                      default: ''
                      description: 记录开始位置，start起始值为0
                  description: 分页设置
                filter:
                  type: object
                  default: ''
                  required:
                  - op
                  - rules
                  properties:
                    op:
                      type: string
                      default: ''
                      description: 操作符。如果是and，则表示多个rule之间是且的关系；如果是or，则表示多个rule之间是或的关系
                    rules:
                      type: array
                      items:
                        type: object
                        default: ''
                        required:
                        - op
                        - field
                        - value
                        properties:
                          op:
                            type: string
                            default: ''
                            description: 操作符（枚举值：eq（等于，不能为空字符串）、neq（不等于，不能为空字符串）、gt、gte、le、lte、in（在给定的数组范围中）、nin（不在给定的数组范围中）、cs（模糊查询，区分大小写）、cis（模糊查询，不区分大小写））
                          field:
                            type: string
                            default: ''
                            description: 查询条件Field名称。可选条件：id(安全组的HCM ID)、vendor(云厂商)、cloud_id(安全组的云上ID)、bk_biz_id(业务ID,-1代表未分配业务)、region(地域)、name(安全组名称)、account_id(云账号的HCM ID)、mgmt_type(管理类型，枚举值：biz（业务管理）、platform（平台管理）)、mgmt_biz_id(管理业务ID)、manager(负责人)、bak_manager(备份负责人)、usage_biz_id(使用业务ID列表，-1代表全部业务可使用)、creator(创建者)、reviser(最后一次修改的修改者)、created_at(创建时间，标准格式：2006-01-02T15:04:05Z)、updated_at(最后一次修改时间，标准格式：2006-01-02T15:04:05Z)
                          value:
                            type: string
                            default: ''
                            description: 查询条件Value值，类型根据field和op的不同而不同
                      default: ''
                      description: 过滤规则，最多设置5个rules。如果rules为空数组，op（操作符）将没有作用，代表查询全部数据
                  description: 查询过滤条件
        required: true
        description: ''
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /api/v1/cloud/bizs/{bk_biz_id}/security_groups/list
          matchSubpath: false
          timeout: 30
