  /api/v1/woa/bizs/{bk_biz_id}/task/apply/recommend/split_suborder:
    post:
      operationId: get_biz_apply_recommend_split_suborder
      description: 主机申请单据拆分试算。将一个已确定的机型方案结合实时预测余量与库存，按计费模式拆分组装成1个主机申请单据(主单)含多个子单：预测内余量满足的台数组装为包年包月(PREPAID)子单，溢出预测外余量的台数组装为按量计费(POSTPAID_BY_HOUR)子单，一个入参组合最多拆2个子单；申请数量尽量满足，无法满足时只要可分配总量≥1即返回部分子单。可传 occupied_suborders 做增量拆分，扣减已占用预测余量与库存后再计算增量子单。
