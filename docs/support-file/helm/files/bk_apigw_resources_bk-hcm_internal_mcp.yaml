                              type: number
                            update_at:
                              type: string
                            failed_num:
                              type: number
                            bk_biz_name:
                              type: string
                            bk_username:
                              type: string
                            pending_num:
                              type: number
                            return_plan:
                              type: string
                            suborder_id:
                              type: string
                            success_num:
                              type: number
                            recycle_type:
                              type: string
                            resource_type:
                              type: string
                            cost_concerned:
                              type: boolean
                      count:
                        type: number
                  result:
                    type: boolean
                    description: 请求成功与否。true:请求成功；false请求失败
                  message:
                    type: string
                    description: 请求失败返回的错误信息
                description: 成功响应
          description: 成功响应
      requestBody:
        content:
          application/json:
            schema:
              type: object
