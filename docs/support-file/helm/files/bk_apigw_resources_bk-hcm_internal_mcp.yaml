  /api/v1/cloud/vendors/{vendor}/applications/types/create_load_balancer:
    post:
      operationId: create_biz_application_for_create_load_balancer
      description: 业务下创建负载均衡申请的接口
      tags:
      - LoadBalancer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    description: 状态码
                  data:
                    type: object
                    description: 响应数据
                  message:
                    type: string
                    description: 请求信息
                description: 成功
          description: 成功
      parameters:
      - in: path
        name: vendor
        schema:
          type: string
        required: true
        description: 云厂商（枚举值：tcloud、aws、azure、gcp、huawei）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - region
              - bk_biz_id
              - account_id
              - cloud_vpc_id
              - require_count
              - load_balancer_type
              - load_balancer_pass_to_target
              properties:
                vip:
                  type: string
                  description: 绑定已有eip的ip地址，，ipv6 nat64 不支持
                memo:
                  type: string
                  description: 备注
                name:
                  type: string
                  description: 名称
                zones:
                  type: array
                  description: 主可用区，仅限公网型
                egress:
                  type: string
                  description: 网络出口
                region:
                  type: string
                  description: 地域
                remark:
                  type: string
                  description: 单据备注
                vip_isp:
                  type: string
                  description: 运营商类型仅公网，枚举值：CMCC,CUCC,CTCC,BGP。通过TCloudDescribeResource 接口确定
                sla_type:
                  type: string
                  description: 性能容量型规格, 留空为共享型
                bk_biz_id:
                  type: string
                  description: 业务ID
                account_id:
                  type: string
                  description: 账号ID
                auto_renew:
                  type: boolean
                  description: 按月付费自动续费
                backup_zones:
                  type: array
                  description: 备可用区，目前仅广州、上海、南京、北京、中国香港、首尔地域的 IPv4 版本的 CLB 支持主备可用区。
                cloud_eip_id:
                  type: string
                  description: 绑定eip id
                cloud_vpc_id:
                  type: string
                  description: 云VpcID
                require_count:
                  type: number
                  description: 购买数量
                cloud_subnet_id:
                  type: string
                  description: 云子网ID ，内网型必填
                address_ip_version:
                  type: string
                  description: ip版本，IPV4,IPV6(ipv6 nat64),IPv6FullChain(ipv6)
                load_balancer_type:
                  type: string
                  description: 网络类型  公网 OPEN，内网 INTERNAL
                bandwidth_package_id:
                  type: string
                  description: 带宽包id，计费模式为带宽包计费时必填
                internet_charge_type:
                  type: string
                  description: 网络计费模式
                bandwidthpkg_sub_type:
                  type: string
                  description: 带宽包的类型，如SINGLEISP（单线）、BGP（多线）。
                internet_max_bandwidth_out:
                  type: string
                  description: 最大出带宽，单位Mbps
                load_balancer_pass_to_target:
                  type: boolean
                  description: 1次校验-仅校验CLB上的安全组,传入true; 2次校验-同时校验CLB和RS上的安全组, 传入false
        required: true
        description: ''
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /api/v1/cloud/vendors/{vendor}/applications/types/create_load_balancer
