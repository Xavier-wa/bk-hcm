          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  data:
                    type: object
                    description: 响应数据
                    additionalProperties: true
                  message:
                    type: string
                    description: 请求信息
              example:
                code: 0
                data:
                  count: 0
                  details:
                  - id: '00000002'
                    memo: account create
                    name: gcp_account
                    site: china
                    type: resource
                    price: ''
                    vendor: gcp
                    creator: Jim
                    reviser: Jim
                    managers:
                    - hcm
                    bk_biz_id: 310
                    extension:
                      cloud_project_id: xxxxx
                      cloud_project_name: xxxxx
                      cloud_service_secret_id: xxxxxxxxxx
                      cloud_service_account_id: xxxxxxxx
                      cloud_service_account_name: hcm-admin
                    bk_biz_ids:
                    - 310
                    created_at: '2022-12-26T07:42:15Z'
                    price_unit: ''
                    updated_at: '2023-04-19T19:29:15Z'
                    usage_biz_ids:
                    - 310
                message: ''
          description: 成功
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              properties:
                page:
                  type: object
                  example:
                    sort: created_at
                    count: false
                    limit: 10
                    order: DESC
                    start: 0
                  required:
                  - count
                  properties:
                    sort:
                      type: string
                      example: created_at
                      description: 排序字段，返回数据将按该字段进行排序
                    count:
                      type: boolean
                      example: false
                      description: 是否返回总记录条数。如果为true，查询结果返回总记录条数count，但查询结果详情数据details为空数组，此时start和limit参数将无效，且必需设置为0。如果为false，则根据start和limit参数，返回查询结果详情数据，但总记录条数count为0
                    limit:
                      type: integer
                      format: uint32
                      example: 10
                      description: 每页限制条数，最大500，不能为0
                    order:
                      enum:
                      - ASC
                      - DESC
                      type: string
                      example: DESC
                      description: 排序顺序
                    start:
                      type: integer
                      format: uint32
                      example: 0
                      description: 记录开始位置，start起始值为0
                  description: 分页设置
                filter:
                  type: object
                  example:
                    op: and
                    rules:
                    - op: eq
                      field: name
                      value: test
                    - op: in
                      field: id
                      value:
                      - sg-001
                      - sg-002
                  required:
                  - op
                  - rules
                  properties:
                    op:
                      enum:
                      - and
                      - or
                      type: string
                      example: and
                      description: 操作符。如果是and，则表示多个rule之间是且的关系；如果是or，则表示多个rule之间是或的关系
                    rules:
                      type: array
                      items:
                        type: object
                        required:
                        - field
                        - op
                        - value
                        properties:
                          op:
                            enum:
                            - eq
                            - neq
                            - gt
                            - gte
                            - lt
                            - lte
                            - in
                            - nin
                            - cs
                            - cis
                            type: string
                            example: eq
                            description: 操作符
                          field:
                            type: string
                            example: name
                            description: 查询条件Field名称
                          value:
                            oneOf:
                            - type: string
                            - type: number
                            - type: boolean
                            - type: array
                              items:
                                oneOf:
                                - type: string
                                - type: number
                                - type: boolean
                            example: test
                            description: 查询条件Value值，类型根据field和op的不同而不同
                      maxItems: 5
                      description: 过滤规则，最多设置5个rules。如果rules为空数组，op（操作符）将没有作用，代表查询全部数据
                  description: 查询过滤条件
        required: true
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /{env.url_path_prefix}api/v1/cloud/accounts/extensions/list
          matchSubpath: false
          timeout: 0
        pluginConfigs:
        - type: bk-rate-limit
          yaml: |
            rates:
              __default:
              - period: 1
                tokens: 500
        authConfig:
          userVerifiedRequired: true
          appVerifiedRequired: true
          resourcePermissionRequired: true
        descriptionEn: None
