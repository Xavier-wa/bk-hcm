  /api/v1/cloud/bizs/{bk_biz_id}/certs/list:
    post:
      operationId: list_cert
      description: 查询业务下的证书列表
      tags:
      - Cert
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  data:
                    type: object
                    properties:
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 证书的HCM ID
                            memo:
                              type: string
                            name:
                              type: string
                            domain:
                              type: array
                              description: 证书域名
                            vendor:
                              type: string
                              description: 云厂商
                            creator:
                              type: string
                            reviser:
                              type: string
                            cloud_id:
                              type: string
                              description: 证书的云上 ID
                            cert_type:
                              type: string
                              description: 证书类型（CA:客户端证书，SVR:服务器证书）
                            account_id:
                              type: string
                              description: 云账号的HCM ID
                            created_at:
                              type: string
                            updated_at:
                              type: string
                            cert_status:
                              type: string
                            cloud_created_time:
                              type: string
                            cloud_expired_time:
                              type: string
                  message:
                    type: string
                description: 成功
          description: 成功
      parameters:
      - in: path
        name: bk_biz_id
        schema:
          type: number
        required: true
        description: 业务ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              - filter
              properties:
                page:
                  type: object
                  default: ''
                  required:
                  - count
                  properties:
                    sort:
                      type: string
                      default: ''
                      description: 排序字段，返回数据将按该字段进行排序
                    count:
                      type: boolean
                      default: ''
                      description: 是否返回总记录条数。如果为true，查询结果返回总记录条数count，但查询结果详情数据details为空数组，此时start和limit参数将无效，且必需设置为0。如果为false，则根据start和limit参数，返回查询结果详情数据，但总记录条数count为0
                    limit:
                      type: number
                      default: ''
                      description: 每页限制条数，最大500，不能为0
                    order:
                      type: string
                      default: ''
                      description: 排序顺序
                    start:
                      type: number
                      default: ''
                      description: 记录开始位置，start起始值为0
                  description: 分页设置
                filter:
                  type: object
                  default: ''
                  required:
                  - op
                  - rules
                  properties:
                    op:
                      type: string
                      default: ''
                      description: 操作符。如果是and，则表示多个rule之间是且的关系；如果是or，则表示多个rule之间是或的关系
                    rules:
                      type: array
                      items:
                        type: object
                        default: ''
                        required:
                        - op
                        - field
                        - value
                        properties:
                          op:
                            type: string
                            default: ''
                            description: 操作符（枚举值：eq（等于，不能为空字符串）、neq（不等于，不能为空字符串）、gt、gte、le、lte、in（在给定的数组范围中）、nin（不在给定的数组范围中）、cs（模糊查询，区分大小写）、cis（模糊查询，不区分大小写））
                          field:
                            type: string
                            default: ''
                            description: '查询条件Field名称。可选条件：id(证书的HCM ID)、cloud_id(证书的云上 ID)、name(证书名称)、vendor(云厂商（枚举值：tcloud、aws、azure、gcp、huawei）)、account_id(云账号的HCM ID)、cert_type(证书类型（CA:客户端证书，SVR:服务器证书）)、cert_status(证书状态。腾讯云: 0：审核中，1：已通过，2：审核失败，3：已过期，4：验证方式为 DNS_AUTO 类型的证书， 已添加DNS记录，5：企业证书，待提交，6：订单取消中，7：已取消，8：已提交资料， 待上传确认函，9：证书吊销中，10：已吊销，11：重颁发中，12：待上传吊销确认函，13：免费证书待提交资料状态，14：已退款)、cloud_created_time(上传时间，标准格式：2006-01-02T15:04:05Z)、cloud_expired_time(过期时间，标准格式：2006-01-02T15:04:05Z)'
                          value:
                            type: string
                            default: ''
                            description: 查询条件Value值，类型根据field和op的不同而不同
                      default: ''
                      description: 过滤规则，最多设置5个rules。如果rules为空数组，op（操作符）将没有作用，代表查询全部数据
                  description: 查询过滤条件
        required: true
        description: ''
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /api/v1/cloud/bizs/{bk_biz_id}/certs/list
          matchSubpath: false
          timeout: 0
        pluginConfigs: []
        authConfig:
          userVerifiedRequired: true
          appVerifiedRequired: true
          resourcePermissionRequired: true
        descriptionEn:
