  /api/v1/woa/config/findmany/config/cvm/device:
    post:
      operationId: list_config_cvm_device
      description: 获取CVM机型规格目录（机型字典），仅返回机型本身的规格属性（机型、机型族、机型分类、通用型/专用型、核心类型、CPU/内存/GPU、地域、可用区等），不包含任何库存/容量信息。
      tags:
      - SCR
      - Cvm
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  data:
                    type: object
                    properties:
                      count:
                        type: number
                        description: 当前规则能匹配到的总记录条数。当 page.count = false 时该值为0
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: id唯一标识
                            zone:
                              type: string
                              description: 可用区
                            memory:
                              type: number
                              description: 内存容量，单位：GB
                            region:
                              type: string
                              description: 地域
                            vendor:
                              type: string
                              description: 云厂商
                            cpu_core:
                              type: number
                              description: CPU核数
                            core_type:
                              type: string
                              description: '核心类型，枚举值：小核心、中核心、大核心 '
                            gpu_amount:
                              type: number
                              description: GPU卡数
                            device_type:
                              type: string
                              description: 机型
                            device_class:
                              type: string
                              description: 机型分类
                            device_family:
                              type: string
                              description: 机型族
                            technical_class:
                              type: string
                              description: 技术分类
                            device_type_class:
                              type: string
                              description: 通/专用机型，SpecialType(专用)，CommonType(通用)
                  message:
                    type: string
          description: ''
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              - filter
              properties:
                page:
                  type: object
                  default: 分页设置
                  required:
                  - count
                  properties:
                    count:
                      type: boolean
                      default: 是否返回总记录条数。 如果为true，查询结果返回总记录条数 count，但查询结果详情数据 details 为空数组，此时 start 和 limit 参数将无效，且必需设置为0。如果为false，则根据 start 和 limit 参数，返回查询结果详情数据，但总记录条数 count 为0
                    limit:
                      type: number
                      default: 每页限制条数，最大500，不能为0
                    start:
                      type: number
                      default: 记录开始位置，start 起始值为0
                filter:
                  type: object
                  default: 查询过滤条件
                  required:
                  - op
                  - rules
                  properties:
                    op:
                      type: string
                      default: 操作符（枚举值：and、or）。如果是and，则表示多个rule之间是且的关系；如果是or，则表示多个rule之间是或的关系
                    rules:
                      type: array
                      items:
                        type: object
                        default: ''
                        properties:
                          op:
                            type: string
                            default: 操作符（枚举值：eq、neq、gt、gte、le、lte、in、nin、cs、cis）
                          field:
                            type: string
                            default: 查询条件字段名，可选值包括：id（唯一 ID，字符串）、vendor（云厂商，字符串，如 tcloud）、device_type（机型，字符串）、device_type_class（通/专用机型，字符串，SpecialType 专用、CommonType 通用）、device_class（机型分类，字符串）、device_family（机型族，字符串）、core_type（核心类型，字符串，大核心/中核心/小核心）、cpu_core（CPU 核心数，数值，单位核）、memory（内存大小，数值，单位 GB）、gpu_amount（GPU 卡数，数值）、technical_class（技术分类，字符串）、region（地域，字符串）、zone（可用区，字符串）、disable（是否不使用，布尔）、source（机型来源，字符串，sync 自动同步、manually 手动添加）、generation_type（机型代次，字符串）、creator（创建人，字符串）、reviser（修改人，字符串）、created_at（创建时间，时间）、updated_at（更新时间，时间）
                          value:
                            default: 查询条件字段值，该值可为任意类型
                      default: 过滤规则，最多设置5个rules。如果rules为空数组，op（操作符）将没有作用，代表查询全部数据
        required: false
        description: ''
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /api/v1/woa/config/findmany/config/cvm/device
          matchSubpath: false
          timeout: 0
        pluginConfigs: []
        authConfig:
          userVerifiedRequired: false
          appVerifiedRequired: true
          resourcePermissionRequired: true
        descriptionEn:
