      - Recycle
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    description: 错误编码。0表示success，>0表示失败错误
                  data:
                    type: object
                    properties:
                      info:
                        type: array
                        items:
                          type: object
                          properties:
                            stage:
                              type: string
                            remark:
                              type: string
                            status:
                              type: string
                            handler:
                              type: string
                            message:
                              type: string
