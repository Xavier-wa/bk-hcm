          method: post
          path: /api/v1/woa/bizs/{bk_biz_id}/plans/resources/gpu/demands/suborders/summary
          matchSubpath: false
          timeout: 0
        pluginConfigs: []
        authConfig:
          userVerifiedRequired: true
          appVerifiedRequired: true
          resourcePermissionRequired: true
        descriptionEn: