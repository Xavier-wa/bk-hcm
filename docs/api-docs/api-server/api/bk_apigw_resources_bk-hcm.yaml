  /api/v1/cloud/bizs/{bk_biz_id}/vendors/{vendor}/images/list:
    post:
      operationId: list_biz_image_ext
      description: 获取业务可使用的镜像列表
      tags:
        - Cvm
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    description: 状态码
                  data:
                    type: object
                    properties:
                      count:
                        type: number
                        description: 当前规则能匹配到的总记录条数，仅在count查询参数设置为true时返回
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 镜像 HCM ID
                            name:
                              type: string
                              description: 镜像名称
                            type:
                              type: string
                              description: 镜像类型（私有、公共或其他类型）
                            state:
                              type: string
                              description: 镜像状态，CREATING-创建中，NORMAL-正常，CREATEFAILED-创建失败，USING-使用中，SYNCING-同步中，IMPORTING-导入中，IMPORTFAILED-导入失败
                            region:
                              type: string
                              description: 地域
                            vendor:
                              type: string
                              description: 云厂商
                            creator:
                              type: string
                              description: 创建者
                            os_type:
                              type: string
                              description: 操作系统类型，如Linux、Windows
                            reviser:
                              type: string
                              description: 修改者
                            cloud_id:
                              type: string
                              description: 镜像在云厂商上的ID
                            platform:
                              type: string
                              description: 镜像平台
                            created_at:
                              type: string
                              description: 创建时间，标准格式：2006-01-02T15:04:05Z
                            updated_at:
                              type: string
                              description: 更新时间，标准格式：2006-01-02T15:04:05Z
                            architecture:
                              type: string
                              description: 镜像架构
                        description: 查询返回的数据，仅在count查询参数设置为false时返回
                    description: 响应数据
                  message:
                    type: string
                    description: 请求信息
          description: ''
      parameters:
        - in: path
          name: vendor
          schema:
            type: string
          required: true
          description: 云厂商（枚举值：tcloud、tcloud-ziyan、aws、gcp、huawei、azure）
        - in: path
          name: bk_biz_id
          schema:
            type: number
          required: true
          description: 业务ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - page
              properties:
                name:
                  type: string
                  default: ''
                  description: 镜像名称关键字，模糊匹配（不区分大小写）
                page:
                  type: object
                  default: ''
                  required:
                    - count
                    - limit
                    - start
                  properties:
                    sort:
                      type: string
                      default: ''
                      description: 用哪个字段排序
                    count:
                      type: boolean
                      default: ''
                      description: 是否返回总记录条数。为 true 时仅返回 count，不返回 details，且 start/limit 需为 0；为 false 时按 start/limit 返回 details，不返回 count
                    limit:
                      type: number
                      default: ''
                      description: 每页限制条数，最大 500，不能为 0
                    order:
                      type: string
                      default: ''
                      description: 排序顺序（枚举值：ASC、DESC）
                    start:
                      type: number
                      default: ''
                      description: 记录开始位置，起始值为 0
                  description: 分页配置
                type:
                  type: string
                  default: ''
                  description: 归一化镜像类型。枚举值：public / private / shared
                region:
                  type: string
                  default: ''
                  description: 地域，精确匹配。如 ap-guangzhou
                platform:
                  type: string
                  default: ''
                  description: 镜像平台，精确匹配。如 CentOS、TencentOS
        required: false
        description: ''
